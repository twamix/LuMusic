services:
  LuMusic:
    image: ghcr.io/twamix/lumusic:latest
    container_name: LuMusic
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8080:8080"
    volumes:
      # 🌟 核心修正：挂载到程序实际的运行目录 /home/appuser/data 下
      - ./data:/home/appuser/data
    environment:
      - TZ=Asia/Shanghai
    command: [ "./music-dl", "web", "--port", "8080", "--no-browser" ]
