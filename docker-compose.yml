services:
  LuMusic:
    image: ghcr.io/twamix/lumusic:latest
    container_name: LuMusic
    restart: unless-stopped
    user: "0:0"
    ports:
      - "8080:8080"
    volumes:
      - type: bind
        source: ./data
        target: /home/appuser/data
        bind:
          create_host_path: true
    environment:
      - TZ=Asia/Shanghai
    command: [ "./music-dl", "web", "--port", "8080", "--no-browser" ]
